# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BoatSafariDBC;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=789
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Spring Boot Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Server Configuration
server.port=8080

# Logging
logging.level.com.se2030.BoatSafariManagement=DEBUG