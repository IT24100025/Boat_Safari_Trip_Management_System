spring.application.name=BoatSafariManagement

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=BoatSafariManagement;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=789
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Logging
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.boatadmin=INFO
logging.level.org.springframework.web=DEBUG
# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Enable detailed error messages
server.error.include-stacktrace=always
server.error.include-message=always
