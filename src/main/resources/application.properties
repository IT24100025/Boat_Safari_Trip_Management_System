# Datasource configuration (default to H2 for dev). For SQL Server, comment H2 and uncomment MSSQL section.

# --- SQL Server (external) ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Payment;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Disable H2 console
spring.h2.console.enabled=false

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
# Rely on your own SQL script to create/populate schema (USE Payment; ...)

# Keep entity/table names as declared (camelCase), avoid snake_case conversion
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Explicit SQL Server dialect to avoid startup failure when JDBC metadata isn't available
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Logging (optional)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
debug=true