<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Boat Safari Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <h2>🌊 Boat Safari Management</h2>
        <p style="color: var(--light-text); margin-bottom: 1.5rem;">Admin Portal</p>

        <form th:action="@{/login}" method="post">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" required autofocus placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter your password">
            </div>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Sign In</button>
        </form>

        <p class="register-link">
            Don't have an admin account?
            <a href="/register" style="color: var(--primary); font-weight: 600;">Contact System Administrator</a>
        </p>

        <div style="margin-top: 2rem; padding: 1rem; background: #f8f9fa; border-radius: 8px; border-left: 4px solid var(--primary);">
            <small style="color: var(--light-text);">
                <strong>Demo Credentials:</strong><br>
                Email: admin@boatsafari.com<br>
                Password: admin123
            </small>
        </div>
    </div>
</div>
</body>
</html>
